[project]
name = "relayops"
version = "0.1.0"
description = "RelayOps autonomous freight agent operations platform"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4.0",
    "flask-cors>=6.0,<7.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "celery>=5.5,<6.0",
    "redis>=5.2,<7.0",
    "structlog>=25.1,<26.0",
    "itsdangerous>=2.2,<3.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<0.16",
    "httpx>=0.28,<0.29",
]

[project.scripts]
relayops = "relayops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a live PostgreSQL/Valkey test dependency",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]
